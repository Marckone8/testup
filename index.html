<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#101228" name="theme-color"/>
<meta content="Explore game and app offers with Testerup. View eligibility and offer requirements." name="description"/>
<title>Explore Testerup game offers</title>
<style>
    :root{color-scheme:dark;--navy:#121329;--red:#e71923;--text:#f8f9ff;--muted:#b5b9d0;--line:rgba(255,255,255,.12)}
    *{box-sizing:border-box}html{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 50% 0%,rgba(231,25,35,.18),transparent 38%),linear-gradient(155deg,#17182f,#090a18 70%);color:var(--text)}
    .shell{width:min(100%,420px)}.brand{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:25px}.brand-icon{width:51px;height:51px;padding:5px;background:#fff;border-radius:16px;object-fit:contain}.brand-name{font-size:23px;font-weight:850;letter-spacing:-.8px}.brand-name span{color:#ff5261}
    .card{padding:31px 24px 24px;background:linear-gradient(160deg,rgba(34,36,69,.98),rgba(15,17,38,.99));border:1px solid var(--line);border-radius:30px;box-shadow:0 28px 80px #0007;text-align:center}
    .mark{width:78px;height:78px;border-radius:25px;display:grid;place-items:center;margin:0 auto 20px;background:linear-gradient(140deg,#ff4451,#cb1120);box-shadow:0 16px 36px #e7192350;font-size:28px;font-weight:900}
    .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ff9aa2;font-weight:800;margin:0 0 10px}h1{font-size:clamp(26px,7vw,33px);line-height:1.14;letter-spacing:-1px;margin:0 0 12px;font-weight:850}p{font-size:14px;line-height:1.65;color:var(--muted);margin:0}.desc{margin:0 auto 24px;max-width:320px}
    .actions{display:grid;gap:11px}.btn{border:0;border-radius:17px;min-height:60px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:15px;font-weight:850;cursor:pointer;font-family:inherit;transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}.yes{background:linear-gradient(125deg,#fc2c3b,#c90f1f);color:#fff;box-shadow:0 14px 32px #e7192344}.no{background:#252740;color:#e8e9f5;border:1px solid var(--line)}
    .disclaimer{margin-top:12px;color:#9fa3c1;font-size:11px}.foot{margin:17px auto 0;max-width:375px;text-align:center;font-size:11px;line-height:1.6;color:#8588a9}.foot a{color:#babee2;text-underline-offset:3px}
  
.brand-icon{width:177px;height:auto;max-height:58px;padding:8px 12px;border-radius:12px}.brand{margin-bottom:22px}
</style>
</head>
<body>
<div class="shell">
<header class="brand">
<img alt="Testerup logo" class="brand-icon" height="51" src="assets/testerup-logo.png" width="51"/>
</header>
<main class="card">
<div aria-hidden="true" class="mark">18+</div>
<div class="tag">Explore offers</div>
<h1>Games, apps &amp;<br/>reward opportunities</h1>
<p class="desc">This page provides information about game and app offers. You can review the participation requirements and any age restrictions on the offer page before signing up.</p>
<div class="actions">
<a class="btn yes" href="lander/index.html" id="mainContinue">Explore offers →</a>
<a class="btn no" href="lander/index.html" id="moreInfo">See how it works</a>
</div>

</main>
<p class="foot"><a href="https://www.testerup.com/terms" rel="noopener noreferrer" target="_blank">Terms &amp; Conditions</a></p>
</div>
</body>
</html>
